<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法政大学 空き教室検索 - 多摩キャンパス</title>
<style>
:root {
  --orange: #FF6600;
  --navy: #00205B;
  --bg: #F5F5F5;
  --card: #FFF;
  --text: #333;
  --sub: #666;
  --border: #E0E0E0;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }

/* Header */
header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(135deg, var(--navy), #003080);
  color: #fff; padding: 14px 20px; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
header h1 { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

/* Container */
.container { padding: 12px 16px 80px; }

/* Section Label */
.section-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--navy);
  margin-bottom: 8px; margin-top: 16px;
}
.section-label::before {
  content: ''; display: block; width: 3px; height: 16px;
  background: var(--orange); border-radius: 2px;
}
.section-label:first-child { margin-top: 4px; }

/* Day Row */
.day-row {
  display: flex; gap: 6px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0 6px;
}
.day-row::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0; width: 52px; height: 44px;
  border: 2px solid var(--border); background: var(--card); color: var(--text);
  border-radius: var(--radius); font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.day-btn:hover { border-color: var(--navy); }
.day-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

/* Period Grid */
.period-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 6px; padding: 2px 0 4px;
}
@media (min-width: 400px) {
  .period-grid { grid-template-columns: repeat(3, 1fr); }
}
.period-btn {
  height: 52px; border: 2px solid var(--border); background: var(--card);
  color: var(--text); border-radius: var(--radius); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
}
.period-btn .time { font-size: 10px; font-weight: 400; color: var(--sub); }
.period-btn:hover { border-color: var(--orange); }
.period-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }
.period-btn.active .time { color: rgba(255,255,255,0.8); }

/* Period Hint */
.period-hint {
  font-size: 11px; color: var(--sub); margin-top: 4px; margin-bottom: 4px;
  padding-left: 2px;
}

/* Building Row */
.building-row {
  display: flex; gap: 6px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0 6px;
}
.building-row::-webkit-scrollbar { display: none; }
.bldg-btn {
  flex-shrink: 0; padding: 8px 14px;
  border: 2px solid var(--border); background: var(--card); color: var(--text);
  border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.bldg-btn:hover { border-color: var(--navy); }
.bldg-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.bldg-btn-all {
  flex-shrink: 0; padding: 8px 14px;
  border: 2px solid var(--orange); background: var(--card); color: var(--orange);
  border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.bldg-btn-all.active { background: var(--orange); color: #fff; }

/* Map */
.map-container { padding: 8px 0; display: flex; justify-content: center; }
svg { max-width: 100%; height: auto; }
.building-clickable { cursor: pointer; transition: opacity 0.15s; }
.building-clickable:hover { opacity: 0.8; }

/* Notice */
.notice {
  background: #FFF8F0; border: 1px solid #FFD9B3; border-radius: var(--radius);
  padding: 10px 12px; font-size: 11px; color: var(--sub); line-height: 1.5;
  margin-top: 12px;
}

/* Results Summary */
.results-summary {
  background: linear-gradient(135deg, var(--navy), #003080);
  border-radius: var(--radius); padding: 16px; margin-top: 16px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff;
}
.results-summary .label { font-size: 14px; font-weight: 600; }
.results-summary .label .day-period { font-size: 18px; font-weight: 800; }
.results-summary .count-box { text-align: right; }
.results-summary .count-num { font-size: 36px; font-weight: 800; color: var(--orange); line-height: 1; }
.results-summary .count-unit { font-size: 14px; font-weight: 600; margin-left: 2px; }

/* Building Group */
.building-group { margin-top: 16px; }
.building-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.building-header .name { font-size: 15px; font-weight: 700; color: var(--navy); }
.building-header .badge {
  background: var(--orange); color: #fff; border-radius: 12px;
  padding: 2px 10px; font-size: 12px; font-weight: 700;
}
.room-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 6px;
}
.room-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 6px; text-align: center;
  font-size: 13px; font-weight: 600; color: var(--text);
  transition: all 0.15s;
}
.room-card:hover { border-color: var(--orange); box-shadow: 0 2px 8px rgba(255,102,0,0.12); }

.no-selection { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
.no-rooms { text-align: center; color: var(--sub); padding: 16px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>法政大学 空き教室検索</h1>
  <p>多摩キャンパス</p>
</header>

<div class="container">
  <!-- 曜日 -->
  <div class="section-label">曜日を選択</div>
  <div class="day-row" id="day-row"></div>

  <!-- 時限 -->
  <div class="section-label">時限を選択</div>
  <div class="period-grid" id="period-grid"></div>
  <div class="period-hint">連続する空きコマをまとめて選択できます</div>

  <!-- 建物 -->
  <div class="section-label">建物（マップをタップで絞り込み）</div>
  <div class="building-row" id="building-row"></div>

  <!-- マップ -->
  <div class="map-container">
    <svg id="campus-map" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" style="max-width:420px;">
      <rect x="0" y="0" width="400" height="300" fill="#EDEADE" rx="8"/>

      <!-- 経済学部棟 -->
      <g class="building-clickable" data-key="経済" id="bldg-経済">

        <text x="46" y="80" fill="#555" font-size="7" text-anchor="middle">経済学部棟</text>
      </g>

      <!-- 社会学部棟 -->

        <text x="124" y="65" fill="var(--navy)" font-size="10" text-anchor="middle" font-weight="800">社</text>
        <text x="124" y="80" fill="#555" font-size="7" text-anchor="middle">社会学部棟</text>
      </g>

      <!-- 現代福祉学部棟 -->
      <g class="building-clickable" data-key="現福" id="bldg-現福">
        <rect x="168" y="40" width="68" height="60" rx="6" fill="#C8D6E5" stroke="var(--navy)" stroke-width="1.5"/>
        <text x="202" y="65" fill="var(--navy)" font-size="10" text-anchor="middle" font-weight="800">現福</text>
        <text x="202" y="80" fill="#555" font-size="7" text-anchor="middle">現代福祉学部棟</text>
      </g>

      <!-- 大教室B棟 -->
      <g class="building-clickable" data-key="B" id="bldg-B">
        <rect x="246" y="40" width="68" height="60" rx="6" fill="#C8D6E5" stroke="var(--navy)" stroke-width="1.5"/>
        <text x="280" y="65" fill="var(--navy)" font-size="10" text-anchor="middle" font-weight="800">B</text>
        <text x="280" y="80" fill="#555" font-size="7" text-anchor="middle">大教室B棟</text>
      </g>

      <!-- 総合棟 -->
      <g class="building-clickable" data-key="総合" id="bldg-総合">
        <rect x="324" y="40" width="64" height="60" rx="6" fill="#C8D6E5" stroke="var(--navy)" stroke-width="1.5"/>
        <text x="356" y="65" fill="var(--navy)" font-size="10" text-anchor="middle" font-weight="800">総合</text>
        <text x="356" y="80" fill="#555" font-size="7" text-anchor="middle">総合棟</text>
      </g>

      <!-- 図書館 (グレー) -->
      <rect x="90" y="140" width="68" height="50" rx="6" fill="#D8D8D8" stroke="#AAA" stroke-width="1"/>
      <text x="124" y="163" fill="#888" font-size="9" text-anchor="middle" font-weight="600">図書館</text>
      <text x="124" y="176" fill="#999" font-size="7" text-anchor="middle">3号館</text>

      <!-- 食堂 (グレー) -->
      <rect x="168" y="140" width="68" height="50" rx="6" fill="#D8D8D8" stroke="#AAA" stroke-width="1"/>
      <text x="202" y="163" fill="#888" font-size="9" text-anchor="middle" font-weight="600">食堂</text>
      <text x="202" y="176" fill="#999" font-size="7" text-anchor="middle">6号館/11号館</text>

      <!-- 緑地 -->
      <rect x="260" y="130" width="120" height="70" rx="6" fill="#D8ECD0" opacity="0.5"/>
      <text x="320" y="170" fill="#6A8F5C" font-size="9" text-anchor="middle" font-weight="600">中央広場</text>

      <!-- バスターミナル -->
      <rect x="0" y="270" width="400" height="30" fill="#C0C0C0" rx="0"/>
      <text x="200" y="289" fill="#555" font-size="9" text-anchor="middle" font-weight="600" letter-spacing="2">バスターミナル</text>

      <!-- バッジ -->
      <circle id="badge-経済" cx="76" cy="44" r="12" fill="var(--orange)" stroke="#fff" stroke-width="1.5" style="display:none"/>
      <text id="badge-text-経済" x="76" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="700" style="display:none"></text>
      <circle id="badge-社" cx="154" cy="44" r="12" fill="var(--orange)" stroke="#fff" stroke-width="1.5" style="display:none"/>
      <text id="badge-text-社" x="154" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="700" style="display:none"></text>
      <circle id="badge-現福" cx="232" cy="44" r="12" fill="var(--orange)" stroke="#fff" stroke-width="1.5" style="display:none"/>
      <text id="badge-text-現福" x="232" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="700" style="display:none"></text>
      <circle id="badge-B" cx="310" cy="44" r="12" fill="var(--orange)" stroke="#fff" stroke-width="1.5" style="display:none"/>
      <text id="badge-text-B" x="310" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="700" style="display:none"></text>
      <circle id="badge-総合" cx="384" cy="44" r="12" fill="var(--orange)" stroke="#fff" stroke-width="1.5" style="display:none"/>
      <text id="badge-text-総合" x="384" y="48" fill="#fff" font-size="10" text-anchor="middle" font-weight="700" style="display:none"></text>
    </svg>
  </div>

  <!-- 注意書き -->
  <div class="notice">
    ※ シラバスの登録データに基づいて空き教室を表示しています。実際の利用状況とは異なる場合があります。臨時の教室変更や施設点検等により、表示されている教室が使用できない場合がありますのでご注意ください。
  </div>

  <!-- 検索結果 -->
  <div id="results"></div>
</div>

<script src="data.js"></script>
<script>
(function() {
  'use strict';

  // マップ上でタップ可能な建物
  var BLDG_KEYS = ['経済','社','現福','B','総合'];
  var KEY_TO_NAME = {
    '経済': '経済学部棟',
    '社': '社会学部棟',
    '現福': '現代福祉学部棟',
    'B': '大教室B棟',
    '総合': '総合棟'
  };
  // 「すべて」選択時のみ表示される建物
  var OTHER_NAMES = ['CALL教室','その他校舎','体育施設','情報実習室','研究実験棟'];

  var DAYS = ['月','火','水','木','金','土'];
  var PERIODS = [
    { label: '1限', time: '09:20-11:00' },
    { label: '2限', time: '11:10-12:50' },
    { label: '3限', time: '13:30-15:10' },
    { label: '4限', time: '15:20-17:00' },
    { label: '5限', time: '17:10-18:50' },
    { label: '6限', time: '19:00-20:40' }
  ];

  var selectedDay = '';
  var selectedPeriods = [];
  var selectedBuildings = new Set();
  var allBuildingsSelected = true;
  var showOtherOnly = false;

  // 教室ナビへのリンクベースURL（デプロイ後に更新）
  var NAVI_BASE_URL = 'https://kakeru1362.github.io/hosei-tama-navi/?room=';

  // --- Initialize UI ---
  function initDayButtons() {
    var row = document.getElementById('day-row');
    DAYS.forEach(function(d) {
      var btn = document.createElement('button');
      btn.className = 'day-btn';
      btn.textContent = d;
      btn.dataset.day = d;
      btn.addEventListener('click', function() {
        selectedDay = d;
        document.querySelectorAll('.day-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        updateAll();
      });
      row.appendChild(btn);
    });
  }

  function initPeriodButtons() {
    var grid = document.getElementById('period-grid');
    PERIODS.forEach(function(p, idx) {
      var btn = document.createElement('button');
      btn.className = 'period-btn';
      btn.dataset.period = p.label;
      btn.dataset.index = idx;
      btn.innerHTML = '<span>' + p.label + '</span><span class="time">' + p.time + '</span>';
      btn.addEventListener('click', function() {
        handlePeriodClick(idx);
      });
      grid.appendChild(btn);
    });
  }

  // 連続コマ選択ロジック
  function handlePeriodClick(clickedIdx) {
    if (selectedPeriods.length === 0) {
      selectedPeriods = [clickedIdx];
    } else if (selectedPeriods.length === 1 && selectedPeriods[0] === clickedIdx) {
      selectedPeriods = [];
    } else if (selectedPeriods.includes(clickedIdx)) {
      // クリックしたコマが選択範囲の端なら縮小、中間なら先頭からそこまで
      var minP = Math.min.apply(null, selectedPeriods);
      var maxP = Math.max.apply(null, selectedPeriods);
      if (clickedIdx === minP) {
        selectedPeriods = makeRange(minP + 1, maxP);
      } else if (clickedIdx === maxP) {
        selectedPeriods = makeRange(minP, maxP - 1);
      } else {
        selectedPeriods = makeRange(minP, clickedIdx);
      }
    } else {
      // 既存の選択範囲を拡張（連続範囲）
      var minP = Math.min.apply(null, selectedPeriods.concat([clickedIdx]));
      var maxP = Math.max.apply(null, selectedPeriods.concat([clickedIdx]));
      selectedPeriods = makeRange(minP, maxP);
    }
    updatePeriodButtons();
    updateAll();
  }

  function makeRange(from, to) {
    var arr = [];
    for (var i = from; i <= to; i++) { arr.push(i); }
    return arr;
  }

  function updatePeriodButtons() {
    document.querySelectorAll('.period-btn').forEach(function(btn) {
      var idx = parseInt(btn.dataset.index, 10);
      btn.classList.toggle('active', selectedPeriods.includes(idx));
    });
  }

  function initBuildingButtons() {
    var row = document.getElementById('building-row');
    // 「すべて」ボタン
    var allBtn = document.createElement('button');
    allBtn.className = 'bldg-btn-all active';
    allBtn.id = 'btn-all';
    allBtn.textContent = 'すべて';
    allBtn.addEventListener('click', function() {
      allBuildingsSelected = true;
      showOtherOnly = false;
      selectedBuildings.clear();
      updateBuildingUI();
      updateAll();
    });
    row.appendChild(allBtn);

    // 「その他」ボタン
    var otherBtn = document.createElement('button');
    otherBtn.className = 'bldg-btn';
    otherBtn.id = 'btn-other';
    otherBtn.textContent = 'その他';
    otherBtn.addEventListener('click', function() {
      allBuildingsSelected = false;
      showOtherOnly = !showOtherOnly;
      selectedBuildings.clear();
      updateBuildingUI();
      updateAll();
    });
    row.appendChild(otherBtn);
  }

  function toggleBuilding(key) {
    allBuildingsSelected = false;
    showOtherOnly = false;
    if (selectedBuildings.has(key)) {
      selectedBuildings.delete(key);
      if (selectedBuildings.size === 0) {
        allBuildingsSelected = true;
      }
    } else {
      selectedBuildings.add(key);
    }
    updateBuildingUI();
    updateAll();
  }

  function updateBuildingUI() {
    document.getElementById('btn-all').classList.toggle('active', allBuildingsSelected);
    document.getElementById('btn-other').classList.toggle('active', showOtherOnly);
    updateBuildingColors();
  }

  // --- SVGマップ ---
  function initMapClicks() {
    BLDG_KEYS.forEach(function(key) {
      var el = document.getElementById('bldg-' + key);
      if (el) {
        el.addEventListener('click', function() { toggleBuilding(key); });
      }
    });
  }

  function updateBuildingColors() {
    BLDG_KEYS.forEach(function(k) {
      var rect = document.querySelector('#bldg-' + k + ' rect');
      if (!rect) return;
      if (selectedBuildings.has(k)) {
        rect.setAttribute('fill', '#FF6600');
      } else {
        rect.setAttribute('fill', '#C8D6E5');
      }
    });
  }

  // --- データ取得 ---
  function getRooms(day, periodLabel, buildingName) {
    try { return DATA.free[day][periodLabel][buildingName] || []; }
    catch(e) { return []; }
  }

  function getRoomsForKey(day, periodLabel, key) {
    if (key === 'その他') {
      var all = [];
      OTHER_NAMES.forEach(function(name) {
        all = all.concat(getRooms(day, periodLabel, name));
      });
      return all;
    }
    return getRooms(day, periodLabel, KEY_TO_NAME[key]);
  }

  // 連続コマ対応: 選択された全時限で空いている教室のintersection
  function getRoomsForPeriods(day, key) {
    if (selectedPeriods.length === 0) return [];
    var periodLabels = selectedPeriods.map(function(idx) { return PERIODS[idx].label; });

    if (key === 'その他') {
      // 「その他」: 各OTHER_NAME建物ごとにroomsを取得し合算してからintersection
      var allRoomsByPeriod = periodLabels.map(function(pl) {
        var rooms = [];
        OTHER_NAMES.forEach(function(name) {
          rooms = rooms.concat(getRooms(day, pl, name));
        });
        return rooms;
      });
      return intersectArrays(allRoomsByPeriod);
    }

    var roomsByPeriod = periodLabels.map(function(pl) {
      return getRoomsForKey(day, pl, key);
    });
    return intersectArrays(roomsByPeriod);
  }

  function intersectArrays(arrays) {
    if (arrays.length === 0) return [];
    if (arrays.length === 1) return arrays[0];
    var setFirst = {};
    arrays[0].forEach(function(r) { setFirst[r] = true; });
    for (var i = 1; i < arrays.length; i++) {
      var nextSet = {};
      arrays[i].forEach(function(r) {
        if (setFirst[r]) nextSet[r] = true;
      });
      setFirst = nextSet;
    }
    return Object.keys(setFirst);
  }

  function getCountForPeriods(day, key) {
    return getRoomsForPeriods(day, key).length;
  }

  function getTotalCount(day) {
    var keysToShow = allBuildingsSelected ? BLDG_KEYS : Array.from(selectedBuildings);
    var total = 0;
    keysToShow.forEach(function(key) {
      total += getCountForPeriods(day, key);
    });
    return total;
  }

  // --- バッジ更新 ---
  function updateBadges() {
    BLDG_KEYS.forEach(function(key) {
      var count = getCountForPeriods(selectedDay, key);
      var badge = document.getElementById('badge-' + key);
      var text = document.getElementById('badge-text-' + key);
      if (!badge || !text) return;
      if (count > 0) {
        text.textContent = count;
        badge.style.display = '';
        text.style.display = '';
      } else {
        badge.style.display = 'none';
        text.style.display = 'none';
      }
    });
  }

  // --- 結果表示 ---
  function getSelectedPeriodLabel() {
    if (selectedPeriods.length === 0) return '';
    if (selectedPeriods.length === 1) return PERIODS[selectedPeriods[0]].label;
    var min = Math.min.apply(null, selectedPeriods);
    var max = Math.max.apply(null, selectedPeriods);
    return PERIODS[min].label + '-' + PERIODS[max].label;
  }

  function updateResults() {
    var results = document.getElementById('results');
    if (!selectedDay || selectedPeriods.length === 0) {
      results.innerHTML = '<div class="no-selection">曜日と時限を選んで空き教室を検索</div>';
      return;
    }

    // 表示対象を決定
    var keysToShow, showOther;
    if (showOtherOnly) {
      keysToShow = [];
      showOther = true;
    } else if (allBuildingsSelected) {
      keysToShow = BLDG_KEYS;
      showOther = true;
    } else {
      keysToShow = Array.from(selectedBuildings);
      showOther = false;
    }

    if (keysToShow.length === 0 && !showOther) {
      results.innerHTML = '<div class="no-selection">マップの建物をタップして絞り込み</div>';
      return;
    }

    // 総数計算
    var totalCount = 0;
    keysToShow.forEach(function(key) { totalCount += getCountForPeriods(selectedDay, key); });
    if (showOther) {
      OTHER_NAMES.forEach(function(name) { totalCount += getRoomsForPeriodsOther(selectedDay, name).length; });
    }

    var periodLabel = getSelectedPeriodLabel();
    var html = '';
    html += '<div class="results-summary">';
    html += '<div class="label"><span class="day-period">' + selectedDay + '曜 ' + periodLabel + '</span><br>の空き教室</div>';
    html += '<div class="count-box"><span class="count-num">' + totalCount + '</span><span class="count-unit">室</span></div>';
    html += '</div>';

    function roomCardHtml(r) {
      return '<div class="room-card"><a href="' + NAVI_BASE_URL + encodeURIComponent(r) + '" style="text-decoration:none;color:inherit" target="_blank">' + r + '</a></div>';
    }

    // メイン建物
    keysToShow.forEach(function(key) {
      var name = KEY_TO_NAME[key];
      var rooms = getRoomsForPeriods(selectedDay, key);
      html += '<div class="building-group">';
      html += '<div class="building-header"><span class="name">' + name + '</span><span class="badge">' + rooms.length + '室</span></div>';
      if (rooms.length > 0) {
        html += '<div class="room-grid">';
        rooms.forEach(function(r) { html += roomCardHtml(r); });
        html += '</div>';
      } else {
        html += '<div class="no-rooms">空き教室なし</div>';
      }
      html += '</div>';
    });

    // その他建物
    if (showOther) {
      OTHER_NAMES.forEach(function(otherName) {
        var rooms = getRoomsForPeriodsOther(selectedDay, otherName);
        if (rooms.length > 0) {
          html += '<div class="building-group">';
          html += '<div class="building-header"><span class="name">' + otherName + '</span><span class="badge">' + rooms.length + '室</span></div>';
          html += '<div class="room-grid">';
          rooms.forEach(function(r) { html += roomCardHtml(r); });
          html += '</div></div>';
        }
      });
    }

    results.innerHTML = html;
  }

  // 「その他」のサブ建物ごとの連続コマintersection
  function getRoomsForPeriodsOther(day, buildingName) {
    if (selectedPeriods.length === 0) return [];
    var periodLabels = selectedPeriods.map(function(idx) { return PERIODS[idx].label; });
    var roomsByPeriod = periodLabels.map(function(pl) {
      return getRooms(day, pl, buildingName);
    });
    return intersectArrays(roomsByPeriod);
  }

  // --- 現在の時限を取得 ---
  function getCurrentPeriod() {
    var now = new Date();
    var dow = now.getDay();
    var dayMap = {1:'月',2:'火',3:'水',4:'木',5:'金',6:'土'};
    var day = dayMap[dow] || '月';
    var h = now.getHours();
    var m = now.getMinutes();
    var t = h * 60 + m;
    var periodIdx = 0;
    if (t >= 1140) periodIdx = 5;       // 19:00〜 → 6限
    else if (t >= 1030) periodIdx = 4;  // 17:10〜 → 5限
    else if (t >= 920) periodIdx = 3;   // 15:20〜 → 4限
    else if (t >= 810) periodIdx = 2;   // 13:30〜 → 3限
    else if (t >= 670) periodIdx = 1;   // 11:10〜 → 2限
    else periodIdx = 0;                 // 〜11:10 → 1限
    return { day: day, periodIdx: periodIdx };
  }

  // --- 全体更新 ---
  function updateAll() {
    updateBadges();
    updateBuildingColors();
    updateResults();
  }

  // --- 初期化 ---
  function init() {
    initDayButtons();
    initPeriodButtons();
    initBuildingButtons();
    initMapClicks();

    var current = getCurrentPeriod();
    selectedDay = current.day;
    selectedPeriods = [current.periodIdx];

    // 曜日ボタン初期active
    document.querySelectorAll('.day-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.day === selectedDay);
    });
    // 時限ボタン初期active
    updatePeriodButtons();

    updateAll();
  }

  init();
})();
</script>
</body>
</html>
